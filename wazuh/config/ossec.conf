<ossec_config>
  <global>
    <jsonout_output>yes</jsonout_output>
    <alerts_log>yes</alerts_log>
    <logall>no</logall>
    <logall_json>yes</logall_json>
    <email_notification>no</email_notification>
    <agents_disconnection_time>15m</agents_disconnection_time>
    <agents_disconnection_alert_time>0</agents_disconnection_alert_time>
    <update_check>yes</update_check>
    <white_list>127.0.0.1</white_list>
    <white_list>^localhost.localdomain$</white_list>
    <white_list>10.0.2.3</white_list>
    <white_list>192.168.1.14</white_list>
    <white_list>192.168.1.3</white_list>
    <white_list>ADMIN_PUBLIC_IP</white_list>
  </global>
  <!-- FIXED: Either add a valid webhook URL or comment out this integration.
       An empty hook_url will cause the integration daemon to fail.
        <white_list>TAILSCALE_IP</white_list>
    <white_list>192.168.100.14</white_list>
    -->
  <!--
  <integration>
    <name>custom-ai-agent-webhook</name>
    <hook_url>https://your-ai-webhook-endpoint.example.com/alerts</hook_url>
    <level>10</level>
    <alert_format>json</alert_format>
  </integration>
  -->
  <integration>
    <name>virustotal</name>
    <!-- REMINDER: Ensure the virustotal_key file exists at /var/ossec/etc/virustotal_key -->
    <api_key>@virustotal_key</api_key>
    <group>syscheck</group>
    <alert_format>json</alert_format>
  </integration>
  <!--
  <integration>
    <name>shuffle</name>
    <hook_url>http://<SHUFFLE_HOST>:3001/api/v1/hooks/<WEBHOOK_ID></hook_url>
    <level>10</level>
    <alert_format>json</alert_format>
  </integration>
  -->
<integration>
    <name>custom-ai-model.py</name>
    <hook_url>http://localhost:9999/placeholder</hook_url>
    <level>3</level>
    <alert_format>json</alert_format>
  </integration>
  <command>
    <name>disable-account</name>
    <executable>disable-account</executable>
    <timeout_allowed>yes</timeout_allowed>
  </command>
  <command>
    <name>restart-wazuh</name>
    <executable>restart-wazuh</executable>
  </command>
  <command>
    <name>firewall-drop</name>
    <executable>firewall-drop</executable>
    <expect>srcip</expect>
    <timeout_allowed>yes</timeout_allowed>
  </command>
  <command>
    <name>host-deny</name>
    <executable>host-deny</executable>
    <timeout_allowed>yes</timeout_allowed>
  </command>
  <command>
    <name>route-null</name>
    <executable>route-null</executable>
    <timeout_allowed>yes</timeout_allowed>
  </command>
  <command>
    <name>win_route-null</name>
    <executable>route-null.exe</executable>
    <timeout_allowed>yes</timeout_allowed>
  </command>
  <command>
    <name>netsh</name>
    <executable>netsh.exe</executable>
    <expect>srcip,win.eventdata.ipAddress</expect>
    <timeout_allowed>yes</timeout_allowed>
  </command>
  <command>
    <name>win_firewall</name>
    <executable>wazuh-firewall.cmd,win.eventdata.ipAddress</executable>
    <expect>srcip</expect>
    <timeout_allowed>yes</timeout_allowed>
  </command>
  <!-- Windows command remains as-is -->
  <command>
    <name>remove-threat-win</name>
    <executable>remove-threat.exe</executable>
    <timeout_allowed>no</timeout_allowed>
  </command>
  <!-- Linux command - requires /var/ossec/active-response/bin/remove-threat.sh to be deployed -->
  <command>
    <name>remove-threat-linux</name>
    <executable>remove-threat.sh</executable>
    <timeout_allowed>no</timeout_allowed>
  </command>
  <!-- Windows agents only -->
  <active-response>
    <disabled>no</disabled>
    <command>remove-threat-win</command>
    <location>local</location>
    <rules_id>87105</rules_id>
    <!-- Add <agent_id> tags here if you want to restrict to specific Windows agents -->
  </active-response>
  <!-- Linux agents only -->
  <active-response>
    <disabled>no</disabled>
    <command>remove-threat-linux</command>
    <location>local</location>
    <rules_id>87105</rules_id>
    <!-- Add <agent_id> tags here if you want to restrict to specific Linux agents -->
  </active-response>
  <!-- FIXED: Added mandatory <disabled>no</disabled> tag.
       Also FIXED: Replaced rule 60204 with 100300 (new custom rule) because
       overwrite="yes" on 60204 was broken - if_matched_group changes are
       ignored by Wazuh during overwrite, and incomplete definitions cause
       undefined behavior. -->
  <active-response>
    <disabled>no</disabled>
    <command>firewall-drop</command>
    <location>local</location>
    <!-- FIXED: 60204 replaced with 100300 (custom rule with frequency=5) -->
    <rules_id>100003,100007,100010,100022,100100,100230,5763</rules_id>
    <timeout>600</timeout>
  </active-response>
  <!-- FIXED: Added mandatory <disabled>no</disabled> tag.
       NOTE: netsh requires 'srcip' to be decoded. Windows events decode IP
       as 'win.eventdata.ipAddress', not 'srcip'. Test with wazuh-logtest to
       verify srcip is populated for rule 100300. If not, consider using
       firewall-drop instead of netsh for Windows blocks. -->
  <active-response>
    <disabled>no</disabled>
    <command>netsh</command>
    <location>local</location>
    <!-- FIXED: Replaced 60204 with 100300 (our new custom rule) -->
    <rules_id>100300,100005</rules_id>
    <timeout>600</timeout>
  </active-response>
  <alerts>
    <log_alert_level>3</log_alert_level>
    <email_alert_level>12</email_alert_level>
  </alerts>
  <logging>
    <log_format>plain</log_format>
  </logging>
  <remote>
    <connection>secure</connection>
    <port>1514</port>
    <protocol>tcp</protocol>
    <queue_size>131072</queue_size>
  </remote>
  <rootcheck>
    <disabled>no</disabled>
    <check_files>yes</check_files>
    <check_trojans>yes</check_trojans>
    <check_dev>yes</check_dev>
    <check_sys>yes</check_sys>
    <check_pids>yes</check_pids>
    <check_ports>yes</check_ports>
    <check_if>yes</check_if>
    <frequency>43200</frequency>
    <rootkit_files>etc/rootcheck/rootkit_files.txt</rootkit_files>
    <rootkit_trojans>etc/rootcheck/rootkit_trojans.txt</rootkit_trojans>
    <skip_nfs>yes</skip_nfs>
    <ignore>/var/lib/containerd</ignore>
    <ignore>/var/lib/docker/overlay2</ignore>
  </rootcheck>
  <wodle name="cis-cat">
    <disabled>yes</disabled>
    <timeout>1800</timeout>
    <interval>1d</interval>
    <scan-on-start>yes</scan-on-start>
    <java_path>wodles/java</java_path>
    <ciscat_path>wodles/ciscat</ciscat_path>
  </wodle>
  <wodle name="osquery">
    <disabled>yes</disabled>
    <run_daemon>yes</run_daemon>
    <log_path>/var/log/osquery/osqueryd.results.log</log_path>
    <config_path>/etc/osquery/osquery.conf</config_path>
    <add_labels>yes</add_labels>
  </wodle>
  <wodle name="syscollector">
    <disabled>no</disabled>
    <interval>1h</interval>
    <scan_on_start>yes</scan_on_start>
    <hardware>yes</hardware>
    <os>yes</os>
    <network>yes</network>
    <packages>yes</packages>
    <ports all="yes">yes</ports>
    <processes>yes</processes>
    <users>yes</users>
    <groups>yes</groups>
    <services>yes</services>
    <browser_extensions>yes</browser_extensions>
    <synchronization>
      <max_eps>10</max_eps>
    </synchronization>
  </wodle>
  <sca>
    <enabled>yes</enabled>
    <scan_on_start>yes</scan_on_start>
    <interval>12h</interval>
    <skip_nfs>yes</skip_nfs>
  </sca>
  <vulnerability-detection>
    <enabled>yes</enabled>
    <index-status>yes</index-status>
    <feed-update-interval>60m</feed-update-interval>
  </vulnerability-detection>
  <indexer>
    <enabled>yes</enabled>
    <hosts>
      <host>https://127.0.0.1:9200</host>
    </hosts>
    <ssl>
      <certificate_authorities>
        <ca>/etc/filebeat/certs/root-ca.pem</ca>
      </certificate_authorities>
      <certificate>/etc/filebeat/certs/wazuh-server.pem</certificate>
      <key>/etc/filebeat/certs/wazuh-server-key.pem</key>
    </ssl>
  </indexer>
  <syscheck>
    <disabled>no</disabled>
    <frequency>43200</frequency>
    <scan_on_start>yes</scan_on_start>
    <alert_new_files>yes</alert_new_files>
    <auto_ignore frequency="10" timeframe="3600">no</auto_ignore>
    <directories>/etc,/usr/bin,/usr/sbin</directories>
    <directories>/bin,/sbin,/boot</directories>
    <directories realtime="yes" restrict="ossec\.conf$">/var/ossec/etc</directories>
    <directories realtime="yes" restrict="local_rules\.xml$">/var/ossec/etc/rules</directories>
    
    <directories realtime="yes">/var/www/html</directories>
    <directories realtime="yes">/opt/demo-ransomware</directories>
    
    <ignore>/etc/mtab</ignore>
    <ignore>/etc/hosts.deny</ignore>
    <ignore>/etc/mail/statistics</ignore>
    <ignore>/etc/random-seed</ignore>
    <ignore>/etc/random.seed</ignore>
    <ignore>/etc/adjtime</ignore>
    <ignore>/etc/httpd/logs</ignore>
    <ignore>/etc/utmpx</ignore>
    <ignore>/etc/wtmpx</ignore>
    <ignore>/etc/cups/certs</ignore>
    <ignore>/etc/dumpdates</ignore>
    <ignore>/etc/svc/volatile</ignore>
    <ignore type="sregex">.log$|.swp$</ignore>
    <nodiff>/etc/ssl/private.key</nodiff>
    <skip_nfs>yes</skip_nfs>
    <skip_dev>yes</skip_dev>
    <skip_proc>yes</skip_proc>
    <skip_sys>yes</skip_sys>
    <process_priority>10</process_priority>
    <max_eps>200</max_eps>
    <synchronization>
      <enabled>yes</enabled>
      <interval>5m</interval>
      <max_eps>10</max_eps>
    </synchronization>
  </syscheck>
  <localfile>
    <log_format>command</log_format>
    <command>df -P</command>
    <frequency>360</frequency>
  </localfile>
  <localfile>
    <log_format>apache</log_format>
    <location>/var/log/apache2/access.log</location>
  </localfile>
  <localfile>
    <log_format>full_command</log_format>
    <command>netstat -tulpn | sed 's/\\([[:alnum:]]\\+\\)\\ +[[:digit:]]\\+\\ +[[:digit:]]\\+\\ +\\(.*\\):\\([[:digit:]]*\\)\\ +\\([0-9\\.\\:\\*]\\+\\).\\+\\ +\\([[:digit:]]*\\/[[:alnum:]\\-]*\\).*/\\1 \\2 == \\3 == \\4 \\5/' | sort -k 4 -g | sed 's/ == \\(.*\\) ==/:\\1/' | sed 1,2d</command>
    <alias>netstat listening ports</alias>
    <frequency>360</frequency>
  </localfile>
  <localfile>
    <log_format>full_command</log_format>
    <command>last -n 20</command>
    <frequency>360</frequency>
  </localfile>
  <!-- With: -->
<!-- <localfile> -->
<!--   <log_format>journald</log_format> -->
<!--   <location>journald</location> -->
<!-- </localfile> -->
  <localfile>
    <log_format>audit</log_format>
    <location>/var/log/audit/audit.log</location>
  </localfile>
  <!-- WARNING: Monitoring active-responses.log can create feedback loops.
       The suppressor rule 100030 now properly prevents this by suppressing
       active-response execution logs (rules 650, 651, 652). -->
  <localfile>
    <log_format>syslog</log_format>
    <location>/var/ossec/logs/active-responses.log</location>
  </localfile>
  <ruleset>
    <decoder_dir>ruleset/decoders</decoder_dir>
    <rule_dir>ruleset/rules</rule_dir>
    <rule_exclude>0215-policy_rules.xml</rule_exclude>
    <list>etc/lists/audit-keys</list>
    <list>etc/lists/amazon/aws-eventnames</list>
    <list>etc/lists/security-eventchannel</list>
    <list>etc/lists/blacklist-alienvault</list>
    <list>etc/lists/malicious-ioc/malware-hashes</list>
    <list>etc/lists/malicious-ioc/malicious-ip</list>
    <list>etc/lists/malicious-ioc/malicious-domains</list>
    <decoder_dir>etc/decoders</decoder_dir>
    <rule_dir>etc/rules</rule_dir>
  </ruleset>
  <rule_test>
    <enabled>yes</enabled>
    <threads>1</threads>
    <max_sessions>64</max_sessions>
    <session_timeout>15m</session_timeout>
  </rule_test>
  <auth>
    <disabled>no</disabled>
    <port>1515</port>
    <use_source_ip>no</use_source_ip>
    <purge>yes</purge>
    <use_password>yes</use_password>
    <ciphers>HIGH:!ADH:!EXP:!MD5:!RC4:!3DES:!CAMELLIA:@STRENGTH</ciphers>
    <ssl_verify_host>no</ssl_verify_host>
    <ssl_manager_cert>etc/sslmanager.cert</ssl_manager_cert>
    <ssl_manager_key>etc/sslmanager.key</ssl_manager_key>
    <ssl_auto_negotiate>no</ssl_auto_negotiate>
  </auth>
</ossec_config>
